schema_version: 1

app:
  headless: true
  multi_gpu: false
  anti_aliasing: 0
  fast_shutdown: true

sim:
  # 120 Hz rigid-body simulation. One policy action is held for six physics
  # steps, yielding the 20 Hz control contract used by training/deployment.
  physics_dt: 0.008333333333333333
  rendering_dt: 0.05
  device: cuda:0
  params:
    gravity: [0.0, 0.0, -9.81]
    use_gpu: true
    use_gpu_pipeline: true
    use_flatcache: true
    enable_scene_query_support: true
    solver_type: 1
    enable_stabilization: true
    bounce_threshold_velocity: 0.2
    friction_offset_threshold: 0.04
    friction_correlation_distance: 0.025
    gpu_max_rigid_contact_count: 524288
    gpu_max_rigid_patch_count: 163840
    gpu_found_lost_pairs_capacity: 4194304
    gpu_found_lost_aggregate_pairs_capacity: 33554432
    gpu_total_aggregate_pairs_capacity: 4194304
    gpu_heap_capacity: 67108864
    gpu_temp_buffer_capacity: 16777216
    gpu_max_num_partitions: 8

scene:
  size_m: [30.0, 30.0, 5.0]
  spawn_position_m: [0.0, 0.0, 1.5]
  flight_bounds_min_m: [-14.5, -14.5, 0.5]
  flight_bounds_max_m: [14.5, 14.5, 4.5]
  ground_color: [0.12, 0.12, 0.12]
  obstacles:
    - name: contact_wall
      position_m: [4.0, 0.0, 1.5]
      size_m: [1.0, 3.0, 3.0]
    - name: box_west
      position_m: [-4.0, -2.5, 1.25]
      size_m: [2.0, 2.0, 2.5]
    - name: wall_north
      position_m: [0.0, 6.0, 1.5]
      size_m: [6.0, 0.8, 3.0]

drone:
  model: hummingbird

control:
  command_frame: yaw_local
  control_hz: 20.0
  physics_steps_per_action: 6
  max_speed_mps: 2.0
  max_yaw_rate_rps: 1.0
  max_acceleration_mps2: 2.0
  max_yaw_acceleration_rps2: 2.0
  # 40 control steps = 2 seconds at 20 Hz.
  random_command_interval_steps: 40
  random_command_overspeed_factor: 1.5
  reference_boundary_margin_m: 1.0

collision:
  contact_force_threshold_n: 0.10
  intentional_contact_steps: 20
  clear_contact_steps: 30

camera:
  model: PXYZ-D455M
  fixed_to_body: true
  prim_name: D455M
  width: 640
  height: 360
  actor_resize: [64, 40]
  # Simulation intrinsics used elsewhere in this repository. Replace them
  # with factory calibration before any real-camera deployment.
  fx: 577.296
  fy: 570.840
  cx: 319.5
  cy: 179.5
  focal_length_mm: 24.0
  min_depth_m: 0.9
  max_depth_m: 20.0
  # The sensor is a child of base_link: it cannot rotate independently. USD
  # cameras look along -Z, so these body axes are converted to its local pose.
  mount_position_body_m: [0.25, 0.0, 0.0]
  forward_axis_body: [1.0, 0.0, 0.0]
  up_axis_body: [0.0, 0.0, 1.0]
  # Isaac 2023.1 may return stale images during the first frames after reset.
  warmup_render_frames: 8
  probe:
    center_patch_px: 21
    front_obstacle: contact_wall
    yaw_test_rad: 1.5707963267948966
    yaw_obstacle: wall_north
    # Tensor pose teleports must advance physics before Fabric propagates the
    # base_link transform to the fixed child camera in Isaac Sim 2023.1.
    pose_sync_control_steps: 1

# First backend stage: a rule-provided target before the front wall. This only
# validates the observation/action/reward/episode contract. The following
# single-wall avoidance curriculum will move the target behind the wall.
navigation_backend:
  fixed_target_position_m: [2.5, 0.0, 1.5]
  fixed_target_yaw_rad: 0.0
  goal_position_tolerance_m: 0.50
  goal_yaw_tolerance_rad: 0.25
  goal_tilt_tolerance_rad: 0.20
  episode_seconds: 30.0
  terminate_on_stall: true
  # A tensor reset is visible to PhysX immediately, but the fixed child camera
  # needs physics to advance before Fabric renders the reset pose.
  reset_pose_sync_control_steps: 1
  lifecycle_probe:
    episodes: 20
    max_steps_per_episode: 160
    position_gain: 0.8
    yaw_gain: 1.5
    max_cruise_speed_mps: 0.8
    reset_position_tolerance_m: 0.005
    reset_speed_tolerance_mps: 0.001
    reset_yaw_tolerance_rad: 0.01
    reset_depth_mae_tolerance: 0.02
    max_torch_cuda_memory_growth_mib: 256.0

probe:
  seed: 0
  # Probe step counts below are control steps, not raw physics steps.
  hover_steps: 600
  random_steps: 1000
  reset_trials: 3
  warmup_steps: 40
  print_interval_steps: 100

acceptance:
  hover_max_position_error_m: 0.50
  hover_final_position_error_m: 0.20
  hover_min_up_z: 0.80
  reset_max_position_error_m: 0.001
  reset_max_speed_mps: 0.001
  random_max_velocity_rmse_mps: 1.50
  random_max_actual_speed_mps: 3.00
  camera_center_depth_abs_error_m: 0.30
  camera_min_range_valid_fraction: 0.02
  camera_pose_sync_yaw_abs_error_rad: 0.05
